services:
  v2_app:
    env_file:
      - ./.env.live_alpaca
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4317
      OTEL_SERVICE_NAME: portfolio-builder-v2-live
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=live
    command: [ "python", "run_app.py", "--config", "config/app_live_alpaca.yml" ]
    volumes:
      - ./data_live_alpaca:/app/v2/data_live_alpaca
    restart: unless-stopped
