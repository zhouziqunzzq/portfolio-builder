groups:
- name: portfolio_builder_eml
  rules:
  - alert: EMLFailedRebalanceRequests_live
    expr: eml_failed_rebalance_requests{deployment_environment=~"live_alpaca|live_publicdotcom|live_publicdotcom_roth|live_publicdotcom_roth_wd"} > 0
    for: 5m
    labels:
      severity: page
      service: eml
    annotations:
      summary: "EML has failed rebalance request(s) ({{ $labels.deployment_environment }})"
      description: "There is at least one failed rebalance request recorded in EML state for {{ $labels.deployment_environment }} (current value: {{ $value }}). Manual intervention may be required."

  - alert: IMLMarketDataFreshnessStale_live
    expr: histogram_quantile(0.99, sum(rate(iml_md_freshness_seconds_bucket{deployment_environment=~"live_alpaca|live_publicdotcom|live_publicdotcom_roth|live_publicdotcom_roth_wd"}[5m])) by (le, deployment_environment)) > 60 * 60 * 24 * 7
    for: 15m
    labels:
      severity: warning
      service: iml
    annotations:
      summary: "IML market data freshness is stale ({{ $labels.deployment_environment }})"
      description: "P99 market data freshness exceeds 7 days for {{ $labels.deployment_environment }} (current value: {{ $value }} seconds)."

  - alert: EMLFailedRebalanceRequests_paper
    expr: eml_failed_rebalance_requests{deployment_environment="paper"} > 0
    for: 5m
    labels:
      severity: warning
      service: eml
      deployment_environment: paper
    annotations:
      summary: "EML has failed rebalance request(s) (paper)"
      description: "There is at least one failed rebalance request recorded in EML state for PAPER (current value: {{ $value }})."
