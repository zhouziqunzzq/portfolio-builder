groups:
- name: portfolio_builder_eml
  rules:
  - alert: EMLFailedRebalanceRequests_live_alpaca
    expr: eml_failed_rebalance_requests{deployment_environment="live_alpaca"} > 0
    for: 5m
    labels:
      severity: page
      service: eml
      deployment_environment: live_alpaca
    annotations:
      summary: "EML has failed rebalance request(s) (live_alpaca)"
      description: "There is at least one failed rebalance request recorded in EML state for LIVE_ALPACA (current value: {{ $value }}). Manual intervention may be required."

  - alert: EMLFailedRebalanceRequests_live_publicdotcom
    expr: eml_failed_rebalance_requests{deployment_environment="live_publicdotcom"} > 0
    for: 5m
    labels:
      severity: page
      service: eml
      deployment_environment: live_publicdotcom
    annotations:
      summary: "EML has failed rebalance request(s) (live_publicdotcom)"
      description: "There is at least one failed rebalance request recorded in EML state for LIVE_PUBLICDOTCOM (current value: {{ $value }}). Manual intervention may be required."

  - alert: EMLFailedRebalanceRequests_live_publicdotcom_roth
    expr: eml_failed_rebalance_requests{deployment_environment="live_publicdotcom_roth"} > 0
    for: 5m
    labels:
      severity: page
      service: eml
      deployment_environment: live_publicdotcom_roth
    annotations:
      summary: "EML has failed rebalance request(s) (live_publicdotcom_roth)"
      description: "There is at least one failed rebalance request recorded in EML state for LIVE_PUBLICDOTCOM_ROTH (current value: {{ $value }}). Manual intervention may be required."

  - alert: EMLFailedRebalanceRequests_paper
    expr: eml_failed_rebalance_requests{deployment_environment="paper"} > 0
    for: 5m
    labels:
      severity: warning
      service: eml
      deployment_environment: paper
    annotations:
      summary: "EML has failed rebalance request(s) (paper)"
      description: "There is at least one failed rebalance request recorded in EML state for PAPER (current value: {{ $value }})."
