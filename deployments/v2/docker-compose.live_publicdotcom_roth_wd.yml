services:
  v2_app:
    env_file:
      - ./.env.live_publicdotcom_roth_wd
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4317
      OTEL_SERVICE_NAME: portfolio-builder-v2-live_publicdotcom_roth_wd
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=live_publicdotcom_roth_wd
    command: [ "python", "run_app.py", "--config", "configs/app_live_publicdotcom_roth_wd.yml" ]
    volumes:
      - ./data_live_publicdotcom_roth_wd:/app/v2/data_live_publicdotcom_roth_wd
    restart: unless-stopped
